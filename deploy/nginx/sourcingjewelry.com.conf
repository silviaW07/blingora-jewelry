# sourcingjewelry.com — Next.js (3000) + RPC (3100) with HTTPS
# Cert files:
#   /etc/nginx/ssl/sourcingjewelry.pem
#   /etc/nginx/ssl/sourcingjewelry.key
#
# On server, replace /etc/nginx/sites-available/default with this file
# (or symlink sites-enabled/default to it), then: nginx -t && systemctl reload nginx

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name sourcingjewelry.com www.sourcingjewelry.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sourcingjewelry.com www.sourcingjewelry.com;

    ssl_certificate     /etc/nginx/ssl/sourcingjewelry.pem;
    ssl_certificate_key /etc/nginx/ssl/sourcingjewelry.key;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Enable HSTS after HTTPS is confirmed working
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 50m;

    # RPC backend
    location /rpc/ {
        proxy_pass http://127.0.0.1:3100/rpc/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Next.js app
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }
}
