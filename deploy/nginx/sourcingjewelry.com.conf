# sourcingjewelry.com — Next.js (3000) + RPC (3100) + image proxy cache
# Certs:
#   /etc/nginx/ssl/sourcingjewelry.pem
#   /etc/nginx/ssl/sourcingjewelry.key
#
# Also install http{} snippets:
#   /etc/nginx/conf.d/00-img-proxy-cache.conf
# Optional China block:
#   /etc/nginx/conf.d/00-geoip-cn-block.conf  (see setup-block-cn.sh)

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name sourcingjewelry.com www.sourcingjewelry.com 8.221.118.113;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sourcingjewelry.com www.sourcingjewelry.com 8.221.118.113;

    ssl_certificate     /etc/nginx/ssl/sourcingjewelry.pem;
    ssl_certificate_key /etc/nginx/ssl/sourcingjewelry.key;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Do not send our domain as Referer to third-party CDNs (alicdn Referer ACL)
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 50m;

    # Optional: uncomment after GeoIP map is installed (setup-block-cn.sh)
    # if ($deny_mainland_cn = 1) {
    #     return 403;
    # }

    # ---- Image proxy: overseas browsers load via our domain; Nginx fetches alicdn ----
    # URL form: /img-proxy/cbu01/img/ibank/xxx.jpg  →  https://cbu01.alicdn.com/img/ibank/xxx.jpg
    location /img-proxy/cbu01/ {
        proxy_pass https://cbu01.alicdn.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host cbu01.alicdn.com;
        proxy_set_header Referer "";
        proxy_set_header User-Agent "Mozilla/5.0 (compatible; SourcingJewelryBot/1.0)";
        proxy_hide_header Set-Cookie;
        proxy_hide_header x-tengine-error;
        proxy_intercept_errors on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;

        proxy_cache img_cache;
        proxy_cache_key "$host$uri$is_args$args";
        # 尺寸后缀 URL 内容唯一，可长缓存：30 天 + immutable（配合 Cloudflare 边缘长期命中）
        proxy_cache_valid 200 301 302 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Img-Cache $upstream_cache_status always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        expires 30d;
    }

    location /img-proxy/cbu02/ {
        proxy_pass https://cbu02.alicdn.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host cbu02.alicdn.com;
        proxy_set_header Referer "";
        proxy_set_header User-Agent "Mozilla/5.0 (compatible; SourcingJewelryBot/1.0)";
        proxy_hide_header Set-Cookie;
        proxy_cache img_cache;
        proxy_cache_key "$host$uri$is_args$args";
        proxy_cache_valid 200 301 302 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Img-Cache $upstream_cache_status always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        expires 30d;
    }

    location /img-proxy/gw/ {
        proxy_pass https://gw.alicdn.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host gw.alicdn.com;
        proxy_set_header Referer "";
        proxy_set_header User-Agent "Mozilla/5.0 (compatible; SourcingJewelryBot/1.0)";
        proxy_hide_header Set-Cookie;
        proxy_cache img_cache;
        proxy_cache_key "$host$uri$is_args$args";
        proxy_cache_valid 200 301 302 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Img-Cache $upstream_cache_status always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        expires 30d;
    }

    # 1688 HTML intake from the operator's local Playwright collector.
    # Guarded by X-Ingest-Token (see INGEST_TOKEN in .env), not by session auth.
    # No sub_filter here: image URLs must reach the parser untouched.
    location /ingest/ {
        proxy_pass http://127.0.0.1:3100/ingest/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    # RPC: rewrite alicdn URLs in JSON so the browser hits our proxy (cacheable)
    location /rpc/ {
        proxy_pass http://127.0.0.1:3100/rpc/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        # Need: nginx compiled with http_sub_module (default on Ubuntu)
        sub_filter_types application/json text/plain text/html;
        sub_filter_once off;
        sub_filter 'https://cbu01.alicdn.com/' 'https://$host/img-proxy/cbu01/';
        sub_filter 'https://cbu02.alicdn.com/' 'https://$host/img-proxy/cbu02/';
        sub_filter 'http://cbu01.alicdn.com/' 'https://$host/img-proxy/cbu01/';
        sub_filter 'http://cbu02.alicdn.com/' 'https://$host/img-proxy/cbu02/';
        sub_filter 'https://gw.alicdn.com/' 'https://$host/img-proxy/gw/';
        proxy_set_header Accept-Encoding "";
    }

    # Hashed Next build assets — 1 year immutable (return visitors)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }
}
